[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-id"
version = "0.1.0"
description = "Pipeline trích xuất CCCD đa định dạng 2 mặt (CCCD gắn chip 2021 & Căn cước 2024)"
authors = [{ name = "Antigravity Pair" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "Pillow>=10",
    "opencv-python-headless>=4.8",
    "fastapi>=0.100",
    "python-multipart>=0.0.6",
    "uvicorn>=0.22",
    "httpx>=0.24",
    "click>=8.0",
    "easyocr>=1.7,<2",
    "vietocr>=0.3.13,<0.4",
    "qreader>=3.16,<4",
    "setuptools<81", # vietocr -> gdown 4.4 imports pkg_resources
]

[project.scripts]
vn-id = "vn_id.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["vn_id*"]

[tool.setuptools.package-data]
"vn_id.ocr" = ["vgg_seq2seq.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
