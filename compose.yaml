services:
  vn-id:
    image: vn-id:0.1.0-gpu
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - model-cache:/home/app/.cache
    gpus: all
    shm_size: "1gb"
    # Stop at startup when GPU access is missing instead of falling back to CPU.
    command:
      - /bin/sh
      - -c
      - >-
        python -c "import torch; assert torch.cuda.is_available(), 'NVIDIA GPU is not available to the container'"
        && exec uvicorn vn_id.api.app:app --host 0.0.0.0 --port 8000 --workers 1

volumes:
  model-cache:
